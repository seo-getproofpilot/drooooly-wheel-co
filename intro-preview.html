<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Load-in sequence — DROOOLY</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=276">
<style>
/* The live plate only fires once per session, which makes it impossible to
   review. This replays it on demand and can also hold it at any moment. */
body{margin:0;background:#07080b;color:#dfe6ee;font-family:Inter,sans-serif;min-height:100vh}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:10000;background:rgba(8,10,14,.94);
  backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.1);
  padding:13px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-family:Michroma;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:8px 14px;border:1px solid rgba(255,255,255,.16);background:#0e1116;color:#b3bdc9;
  cursor:pointer;border-radius:2px}
.pill:hover{color:#fff;border-color:rgba(255,255,255,.34)}
.pill[aria-pressed="true"]{background:#1f7bff;border-color:#1f7bff;color:#fff}
.hint{color:#77818e;font-size:12px}
/* holding a frame: freeze every animation at a chosen moment */
/* Pause only. An earlier version also zeroed animation-delay here, which
   made the plate's own dismiss animation fire immediately and left an
   empty screen — the thing being reviewed had already gone. */
body.hold .intro,body.hold .intro *,body.hold .intro *::after{animation-play-state:paused !important}

/* A still frame, built without animation at all. Pausing depends on the
   animations having actually run, and a backgrounded tab throttles them —
   which showed an empty plate rather than a held one. This states the
   mid-sweep values outright, so the frame is the same every time. */
body.frame .intro,body.frame .intro *{animation:none !important}
body.frame .intro{opacity:1 !important;visibility:visible !important}
body.frame .intro__logo{opacity:1 !important;transform:none !important}
body.frame .intro__filled{opacity:1 !important}
body.frame .intro__outline{opacity:0 !important}
body.frame .intro__glint{opacity:1 !important;background-position:var(--fpos,50%) 0 !important}
</style></head><body>

<div class="intro" id="intro" aria-hidden="true">
  <div class="intro__logo">
    <img class="intro__outline" src="assets/logo-outline.png?v=276" alt="">
    <img class="intro__filled"  src="assets/logo-filled.png?v=276"  alt="">
    <span class="intro__glint"></span>
  </div>
  <span class="intro__skip">Click to skip</span>
</div>

<div class="bar">
  <button class="pill" id="replay">Replay</button>
  <span class="hint">Hold at:</span>
  <button class="pill hf" data-t="600">0.6s</button>
  <button class="pill hf" data-t="900">0.9s</button>
  <button class="pill hf" data-t="1100">1.1s</button>
  <button class="pill hf" data-t="1300">1.3s</button>
  <button class="pill hf" data-t="1600">1.6s</button>
  <span class="hint">&mdash; the sweep runs 0.8s to 1.75s.</span>
  <span class="hint" style="margin-left:14px">Still frame:</span>
  <button class="pill ff" data-p="95%">sweep at D</button>
  <button class="pill ff" data-p="55%">middle</button>
  <button class="pill ff" data-p="15%">sweep at Y</button>
</div>

<script>
var plate = document.getElementById('intro');
function replay(){
  document.body.classList.remove('hold','frame');
  var clone = plate.cloneNode(true);
  plate.replaceWith(clone); plate = clone;
  plate.style.animationPlayState = '';
}
document.getElementById('replay').addEventListener('click', replay);
document.querySelectorAll('.ff').forEach(function(b){
  b.addEventListener('click', function(){
    replay();
    document.body.classList.remove('hold');
    document.body.classList.add('frame');
    document.body.style.setProperty('--fpos', b.dataset.p);
  });
});
document.querySelectorAll('.hf').forEach(function(b){
  b.addEventListener('click', function(){
    replay();
    setTimeout(function(){ document.body.classList.add('hold'); }, +b.dataset.t);
  });
});
</script>
</body></html>

<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find your set — every option, numbered</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Self-contained on purpose: nothing here depends on styles.css, so every
   option renders exactly as written and none can be overridden. */
@property --lip{syntax:'<angle>';initial-value:0deg;inherits:false}
*{box-sizing:border-box}
body{margin:0;background:#0a0e14;color:#e8edf3;font-family:Inter,system-ui,sans-serif;padding:34px 30px 90px}
h1{font-family:Michroma;font-size:18px;margin:0 0 8px}
p.sub{color:#8e99a6;font-size:13.5px;line-height:1.7;max-width:680px;margin:0 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:26px 30px}
.opt{background:#0d1118;border:1px solid rgba(255,255,255,.08);padding:20px 20px 22px}
.opt h2{font-family:Michroma;font-size:11px;letter-spacing:.09em;margin:0 0 3px;color:#cfd8e2}
.opt .num{color:#4f9bff}
.opt p{color:#7d8794;font-size:11.5px;line-height:1.55;margin:0 0 16px;min-height:32px}
.stageband{background:#0a0c10 url(assets/truck-hero.jpg) center/cover;padding:22px 18px;
  display:flex;justify-content:center;border:1px solid rgba(255,255,255,.06)}
.b{position:relative;display:inline-flex;align-items:center;justify-content:center;
  min-height:58px;padding:0 30px;border:0;cursor:pointer;text-decoration:none;overflow:hidden;
  font-family:Michroma;font-weight:400;font-size:14px;letter-spacing:.03em;text-transform:uppercase;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%);
  transition:filter .3s,transform .22s,box-shadow .3s,background .3s,color .3s}

/* 1 — live right now */
.o1{color:#10141a;text-shadow:0 1px 0 rgba(255,255,255,.5);
  background:url(assets/hero-btn-face.png?v=296) center/100% 100% no-repeat;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.6))}
/* 2 — 01 forged */
.o2{color:#e9eef4;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%),
    linear-gradient(180deg,#525963,#343b45 26%,#1e232a 58%,#161a20 82%,#20252c);
  box-shadow:inset 1.4px 1.4px 0 rgba(226,236,247,.6),inset -1.4px -1.4px 0 rgba(0,0,0,.8),inset 0 3px 8px rgba(0,0,0,.42);
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
/* 3 — 03 floating chrome plate */
.o3{color:#eaeff5;background:#0b0d12;clip-path:none;border-radius:2px;
  box-shadow:0 18px 40px rgba(0,0,0,.72),0 3px 8px rgba(0,0,0,.5);overflow:visible}
.o3::after{content:"";position:absolute;inset:0;border-radius:2px;padding:1px;pointer-events:none;
  background:linear-gradient(180deg,#f2f6fa,#aeb8c4 16%,#4c545e 46%,#262b33 78%,#161a20);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
/* 4 — 05 chrome liquid (the original, dark mirror horizon) */
.o4{color:#10141a;text-shadow:0 1px 0 rgba(255,255,255,.5);
  background:
    radial-gradient(130% 90% at 50% 50%,rgba(255,255,255,.96),rgba(255,255,255,0) 46%),
    radial-gradient(60% 120% at 18% 12%,#fff,rgba(255,255,255,0) 55%),
    radial-gradient(75% 60% at 82% 88%,#e6ecf3,rgba(255,255,255,0) 60%),
    radial-gradient(45% 80% at 62% 30%,#9ba5b1,rgba(255,255,255,0) 58%),
    linear-gradient(168deg,#e2e8ef,#b9c2cc 32%,#78828e 52%,#cdd5de 72%,#eef3f8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 6px rgba(0,0,0,.3);
  filter:drop-shadow(0 12px 26px rgba(0,0,0,.5))}
/* 5 — the nav's liquid chrome (lighter horizon, white inner ring) */
.o5{color:#10141a;text-shadow:0 1px 0 rgba(255,255,255,.55);
  background:
    radial-gradient(60% 120% at 18% 12%,#fff,rgba(255,255,255,0) 55%),
    radial-gradient(75% 60% at 82% 88%,#e6ecf3,rgba(255,255,255,0) 60%),
    radial-gradient(45% 80% at 62% 30%,#9ba5b1,rgba(255,255,255,0) 58%),
    linear-gradient(168deg,#e8edf3,#c2cbd5 32%,#848e9a 52%,#d3dae2 72%,#f1f5f9);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),inset 0 -2px 5px rgba(0,0,0,.28);
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
/* 6 — 12 polished lip */
.o6{color:#e9eef4;background:#0a0c10;filter:drop-shadow(0 12px 26px rgba(0,0,0,.6))}
.o6::after{content:"";position:absolute;inset:0;padding:4px;pointer-events:none;
  background:conic-gradient(from var(--lip),#fff,#9aa4b0 9%,#2a3039 22%,#e8eef5 34%,#4e5761 47%,#c3ccd6 62%,#232830 78%,#8f99a5 90%,#fff);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;transition:--lip .5s cubic-bezier(.22,.7,.3,1)}
.o6:hover::after{--lip:150deg}
/* 7 — plain polished chrome, bright, no mirror line */
.o7{color:#0c0e12;text-shadow:0 1px 0 rgba(255,255,255,.5);
  background:linear-gradient(180deg,#fff,#fbfcfd 10%,#f2f5f8 26%,#e4e9ee 42%,#d3dae1 58%,#c2cad2 74%,#bcc5ce 88%,#ccd4db 96%,#e0e6ea);
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
/* 8 — brushed nickel */
.o8{color:#14181e;text-shadow:0 1px 0 rgba(255,255,255,.35);
  background:repeating-linear-gradient(94deg,rgba(255,255,255,.1) 0 1px,rgba(0,0,0,.05) 1px 2px,transparent 2px 4px),
    linear-gradient(180deg,#c8cfd7,#aab3bd 30%,#8d97a2 52%,#a7b0ba 74%,#ccd3da);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 6px rgba(0,0,0,.28);
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
/* 9 — chrome with a graphite cut line */
.o9{color:#0d1116;text-shadow:0 1px 0 rgba(255,255,255,.6);
  background:radial-gradient(90% 150% at 22% 16%,rgba(255,255,255,.55),rgba(255,255,255,0) 52%),
    linear-gradient(180deg,#fff,#eef2f6 22%,#d5dce4 46%,#b9c2cc 62%,#dde3ea 82%,#fafbfc);
  box-shadow:inset 0 0 0 1.5px rgba(22,28,36,.78),inset 0 1px 0 rgba(255,255,255,.85);
  filter:drop-shadow(0 12px 26px rgba(0,0,0,.6))}
/* 10 — blue chrome */
.o10{color:#07101d;text-shadow:0 1px 0 rgba(255,255,255,.4);
  background:linear-gradient(180deg,#eaf3ff,#c2daf7 26%,#8db6e8 46%,#5b8ccb 66%,#9cc3ee 88%,#e4f0ff);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 6px rgba(9,38,78,.3);
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
/* 11 — murdered out */
.o11{color:#5d6773;
  background:linear-gradient(180deg,#15181d,#0d1014 40%,#090b0e 62%,#111419);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.9);
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.o11:hover{color:#f2f6fa;background:linear-gradient(180deg,#3c434d,#20262e 38%,#0f1318 60%,#2a313a)}
/* 12 — the light moves (gunmetal, sweep on hover) */
.o12{color:#c3ccd6;
  background:repeating-linear-gradient(92deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#1c2026,#12161b 44%,#0c0f13 66%,#171b21);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.85);
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.o12::before{content:"";position:absolute;inset:-70% auto -70% -40%;width:22%;transform:rotate(14deg);
  background:linear-gradient(90deg,transparent,rgba(214,232,255,.28) 26%,rgba(255,255,255,.95) 50%,rgba(214,232,255,.28) 74%,transparent)}
.o12:hover::before{animation:sw .52s cubic-bezier(.4,0,.25,1) forwards}
@keyframes sw{from{left:-40%}to{left:118%}}
</style></head><body>
<h1>Find your set &mdash; every option we have built</h1>
<p class="sub">All on the hero photo, same size, same label. <b>Tell me the number.</b>
   Number 1 is what is on the site right now. Hover 6, 11 and 12 &mdash; those three do
   something on hover.</p>
<div class="grid" id="g"></div>
<script>
var opts=[
 ["Live on the site now","Built from your screenshot's own metal"],
 ["01 Forged","Gunmetal billet, bevelled edge, inner shadow"],
 ["03 Floating chrome plate","Black plate, 1px chrome perimeter"],
 ["05 Chrome liquid","Offset reflections, dark mirror line at 52%"],
 ["Nav chrome","05 with a lighter mirror line and a white inner ring"],
 ["12 Polished lip","Black face, polished lip that orbits on hover"],
 ["Plain polished chrome","The site's original chrome fill, no reflections"],
 ["Brushed nickel","Machined grain, mid grey"],
 ["Chrome + graphite cut line","Bright face, hard dark edge all round"],
 ["Blue chrome","The brand colour as a metal"],
 ["Murdered out","Nearly invisible at rest, reveals on hover"],
 ["The light moves","Gunmetal; a reflection crosses it on hover"]
];
document.getElementById('g').innerHTML = opts.map(function(o,i){
  return '<div class="opt"><h2><span class="num">'+(i+1)+'</span> &nbsp;'+o[0]+'</h2><p>'+o[1]+'</p>'+
         '<div class="stageband"><a href="#" class="b o'+(i+1)+'">Find your set</a></div></div>';
}).join('');
</script>
</body></html>
